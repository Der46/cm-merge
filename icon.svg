<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="合併島嶼矩陣閃電計算器">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb23e"/>
      <stop offset="0.55" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#ff4f88"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c2"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7a2e00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="96" cy="80" r="150" fill="#fff" opacity="0.14"/>

  <!-- 3 × 3 matrix -->
  <g fill="#fff">
    <rect x="96"  y="96"  width="92" height="92" rx="22" opacity="0.92"/>
    <rect x="210" y="96"  width="92" height="92" rx="22" opacity="0.55"/>
    <rect x="324" y="96"  width="92" height="92" rx="22" opacity="0.92"/>
    <rect x="96"  y="210" width="92" height="92" rx="22" opacity="0.55"/>
    <rect x="210" y="210" width="92" height="92" rx="22" opacity="0.92"/>
    <rect x="324" y="210" width="92" height="92" rx="22" opacity="0.55"/>
    <rect x="96"  y="324" width="92" height="92" rx="22" opacity="0.92"/>
    <rect x="210" y="324" width="92" height="92" rx="22" opacity="0.55"/>
    <rect x="324" y="324" width="92" height="92" rx="22" opacity="0.92"/>
  </g>

  <!-- lightning bolt -->
  <path filter="url(#shadow)" d="M290 58 L150 286 H244 L212 454 L364 206 H268 Z"
        fill="url(#bolt)" stroke="#e46f00" stroke-width="14" stroke-linejoin="round"/>
</svg>
